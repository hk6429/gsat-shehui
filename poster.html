<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>學測社會題庫海報</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    .poster { width: min(820px, 92vw); text-align: center; padding: 64px; border: 10px solid #26333e; background: white; }
    .poster h1 { font-size: clamp(3rem, 9vw, 6rem); margin: 0; font-family: "Noto Serif TC", serif; }
    .poster p { font-size: 1.35rem; }
    .poster .status { color: #572029; font-weight: 800; }
  </style>
</head>
<body>
  <main class="poster">
    <p class="eyebrow">HISTORY · GEOGRAPHY · CIVICS</p>
    <h1>學測社會題庫</h1>
    <p>官方真題．分類練習．非選擇題評分原則</p>
    <p class="status">114–115 學年度 129 題完整收錄</p>
  </main>
</body>
</html>
